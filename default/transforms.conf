# KV Store lookups for User Governance app

[flagged_searches_lookup]
collection = flagged_searches
external_type = kvstore
fields_list = _key, search_name, search_owner, search_app, flagged_by, flagged_time, notification_sent, notification_time, remediation_deadline, status, reason, notes

[governance_settings_lookup]
collection = governance_settings
external_type = kvstore
fields_list = _key, setting_name, setting_value, description

[governance_audit_log_lookup]
collection = governance_audit_log
external_type = kvstore
fields_list = _key, timestamp, action, search_name, performed_by, details

# Lookup for cron to seconds conversion
[cron_frequency_lookup]
filename = cron_frequency.csv

# Default settings lookup (CSV-based, used for initial setup)
[governance_settings_default]
filename = governance_settings.csv
